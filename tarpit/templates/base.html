<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Telegram Tarpit{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body data-server-now="{{ server_now() }}" data-page="{% block page %}{% endblock %}">
  <header class="topbar">
    <a class="brand" href="/">🕸️ Telegram Tarpit</a>
    <nav>
      <a href="/">Übersicht</a>
      <a href="/personas">Personas</a>
      <a href="/verbrauch">Verbrauch</a>
      <a href="/logs">Log &amp; Status</a>
      <a href="/settings">Einstellungen</a>
    </nav>
  </header>
  <main class="{% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
